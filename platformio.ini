; Fall Detection & SOS Device – Firmware v7.5
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
; pioarduino = Community-Plattform mit Arduino-ESP32 Core 3.x
; (die offizielle "espressif32"-Plattform liefert nur Core 2.x – der Code läuft mit beiden)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; USB-Seriell über den nativen USB-Port des S3 (wie "USB CDC On Boot: Enabled")
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit MPU6050@^2.2.9
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BusIO@^1.17.4
    ESP32Async/ESPAsyncWebServer@^3.12.1   ; bringt AsyncTCP automatisch mit
